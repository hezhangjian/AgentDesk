[package]
name = "agentdesk"
version = "0.0.1"
edition = "2024"
description = "AgentDesk is a desktop GUI for AI agents."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/hezhangjian/AgentDesk"

[dependencies]
anyhow = "1"
dirs = "6"
gpui-kit = "0.7.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
